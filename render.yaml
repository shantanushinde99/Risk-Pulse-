services:
  - type: web
    name: riskpulse-backend
    env: docker
    rootDir: backend
    envVars:
      - key: MOSS_PROJECT_ID
        sync: false
      - key: MOSS_PROJECT_KEY
        sync: false
      - key: LLM_PROVIDER
        value: mistral
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: mistral-small-latest
      - key: RESEND_API_KEY
        sync: false
      - key: DEMO_CUSTOMER_EMAIL
        sync: false
