services:
  - type: web
    name: riskpulse-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MOSS_PROJECT_ID
        sync: false
      - key: MOSS_PROJECT_KEY
        sync: false
      - key: LLM_PROVIDER
        value: mistral
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: mistral-large-latest
      - key: RESEND_API_KEY
        sync: false
      - key: DEMO_CUSTOMER_EMAIL
        sync: false
