[package]
name = "shantanushinde99/riskpulse"
version = "0.1.3"
description = "RiskPulse Dashboard"

[dependencies]
"wasmer/static-web-server" = "^1"

[fs]
"/public" = "out"

[[command]]
name = "script"
module = "wasmer/static-web-server:webserver"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-d", "/public"]
env = ["PORT=8080"]
